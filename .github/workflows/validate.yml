name: Validate Pulsar

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install commit tooling
        if: github.base_ref != 'main'
        run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: |
          for sha in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            subject=$(git log -1 --format='%s' "$sha")
            echo "$subject" | grep -qE '^Merge ' && continue
            case "$subject" in
              "chore(release):"*) echo "SKIP release commit $sha"; continue ;;
            esac
            author=$(git log -1 --format='%an' "$sha")
            case "$author" in
              *"[bot]"*) echo "SKIP bot commit $sha ($author)"; continue ;;
            esac
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            if [ "${{ github.base_ref }}" != "main" ]; then
              pnpm exec commitlint --edit /tmp/commit-msg.txt
            fi
          done
          echo "PASS conventional commits"

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify minimal baseline
        if: github.base_ref == 'main'
        run: |
          for f in README.md LICENSE NOTICE AGENTS.md .gitignore .github/CODEOWNERS; do
            test -s "$f" || { echo "FAIL missing $f"; exit 1; }
          done
          echo "PASS baseline files present"

      - uses: pnpm/action-setup@v4
        if: github.base_ref != 'main'
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        if: github.base_ref != 'main'
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        if: github.base_ref != 'main'
        with:
          components: rustfmt, clippy
      - name: Run the full local suite
        if: github.base_ref != 'main'
        run: pnpm validate
