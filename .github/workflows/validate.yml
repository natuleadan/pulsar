name: validate

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  commit-lint:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install commit tooling
        run: pnpm install --frozen-lockfile
      - name: Validate commit messages
        run: |
          for sha in $(git rev-list "origin/${{ github.base_ref }}..HEAD"); do
            subject=$(git log -1 --format='%s' "$sha")
            echo "$subject" | grep -qE '^Merge ' && continue
            case "$subject" in
              "chore(release):"*) echo "SKIP release commit $sha"; continue ;;
            esac
            author=$(git log -1 --format='%an' "$sha")
            case "$author" in
              *"[bot]"*) echo "SKIP bot commit $sha ($author)"; continue ;;
            esac
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            pnpm exec commitlint --edit /tmp/commit-msg.txt
          done

  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install shellcheck and shfmt
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt


      - name: Validate workspace, formatting, clippy, tests and release plan
        run: pnpm validate

