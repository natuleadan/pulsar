[package]
name = "pulsar-client"
version.workspace = true
edition.workspace = true
description = "Multi-device client interface for interacting with the Pulsar orchestrator"
license.workspace = true
publish = false

[dependencies]
pulsar-protocol = { path = "../protocol" }
pulsar-styles = { path = "../styles" }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = { version = "2.2", default-features = false }
hex = "0.4"
ratatui = { version = "0.30", default-features = false, features = ["all-widgets", "layout-cache", "macros", "underline-color"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
crossterm = "0.29"
ratatui = { version = "0.30", features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.43", features = ["full"] }

[dev-dependencies]
pulsar-server = { path = "../server" }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
