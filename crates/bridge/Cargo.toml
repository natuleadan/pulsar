[package]
name = "pulsar-bridge"
version.workspace = true
edition.workspace = true
description = "Local hardware, robotics, IoT device bridge, and zero-trust LAN shield"
license.workspace = true
publish = false

[dependencies]
pulsar-protocol = { path = "../protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.43", features = ["rt", "macros", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
