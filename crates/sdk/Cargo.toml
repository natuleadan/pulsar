[package]
name = "agents-sdk"
version.workspace = true
edition.workspace = true
description = "Public programmatic SDK for interacting with the Agents Server and Boxer sandboxes"
license.workspace = true
publish = false

[dependencies]
agents-protocol = { path = "../protocol" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tokio = { version = "1.43", features = ["rt", "macros"] }

[lints]
workspace = true
